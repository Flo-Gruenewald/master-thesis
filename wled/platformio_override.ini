; WLED 0.15.1 for the TOP spotlight subnode: ESP32 DevKit V1, LEDs on GPIO4, LD2450 radar TX -> GPIO16.
[platformio]
default_envs = top_ld2450

[env:top_ld2450]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -D USERMOD_LD2450 -D LD2450_RX_PIN=16

; WLED 0.15.1 for the ACCENT table unit: ESP32-C3 SuperMini, 89 SK6812 RGBW LEDs on GPIO7,
; INMP441 mic (SD=4, WS=5, SCK=6, L/R=GND) via the audioreactive usermod, current limit 1.8 A (power bank port).
[env:table_c3]
extends = env:esp32c3dev
board_build.partitions = ${esp32.big_partitions}   ; 1.8 MB app slots: WLED + audioreactive is 1.59 MB, too big for the default 1.5 MB
build_flags = ${env:esp32c3dev.build_flags}
  ${esp32.AR_build_flags}
  -D SERVERNAME='"Table"' -D MDNS_NAME='"easteregged-table"'
  -D DATA_PINS=7 -D PIXEL_COUNTS=89 -D LED_TYPES=TYPE_SK6812_RGBW -D ABL_MILLIAMPS_DEFAULT=1800
  -D UM_AUDIOREACTIVE_ENABLE -D SR_DMTYPE=1 -D I2S_SDPIN=4 -D I2S_WSPIN=5 -D I2S_CKPIN=6
lib_deps = ${env:esp32c3dev.lib_deps}
  ${esp32.AR_lib_deps}

; same as table_c3, with WLED's debug log on USB serial (Wi-Fi connect reasons etc.)
[env:table_c3_debug]
extends = env:table_c3
build_flags = ${env:table_c3.build_flags} -D WLED_DEBUG

; table unit with the mic STREAMED to the room host (15.10): no audioreactive (the stream owns I2S),
; usermod_audio_stream sends 16 kHz mono over UDP to AS_TARGET:7010 (changeable in WLED → Usermods → AudioStream)
[env:table_c3_stream]
extends = env:esp32c3dev
board_build.partitions = ${esp32.big_partitions}
build_flags = ${env:esp32c3dev.build_flags}
  -D SERVERNAME='"Table"' -D MDNS_NAME='"table-unit"'
  -D DATA_PINS=7 -D PIXEL_COUNTS=89 -D LED_TYPES=TYPE_SK6812_RGBW -D ABL_MILLIAMPS_DEFAULT=1800
  -D USERMOD_AUDIO_STREAM -D AS_SD_PIN=4 -D AS_WS_PIN=5 -D AS_SCK_PIN=6 -D AS_TARGET='"192.168.137.1"' -D AS_PORT=7010

; WALL unit (16.10.2026): ESP32-C3 SuperMini, 60 RGBW LEDs on GPIO5, second LD2450 radar TX -> GPIO6 (Serial1).
; Avoid GPIO1/2 (damaged on this board), 8/9 (boot/LED). mDNS "wall-unit" (the host finds it by name).
; Radar topics: easteregged/in/presence_wall/... (the spotlight radar keeps in/presence/...).
[env:wall_c3_ld2450]
extends = env:esp32c3dev
board_build.partitions = ${esp32.big_partitions}
build_flags = ${env:esp32c3dev.build_flags}
  -D SERVERNAME='"Wall"' -D MDNS_NAME='"wall-unit"'
  -D DATA_PINS=5 -D PIXEL_COUNTS=60 -D LED_TYPES=TYPE_SK6812_RGBW -D ABL_MILLIAMPS_DEFAULT=1800
  -D USERMOD_LD2450 -D LD2450_RX_PIN=6 -D LD2450_SOURCE='"presence_wall"'
