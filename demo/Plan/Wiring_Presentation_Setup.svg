<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1070" width="1500" height="1070">
  <defs>
    <style>
      .t  { font-family: 'PP Pangaia', Georgia, serif; fill: #F2EAE3; }
      .s  { font-family: 'PP Neue Montreal', 'Helvetica Neue', Arial, sans-serif; fill: #B8A99C; }
      .b  { font-family: 'PP Neue Montreal', 'Helvetica Neue', Arial, sans-serif; fill: #F2EAE3; }
      .m  { font-family: 'PP Neue Montreal', 'Helvetica Neue', Arial, sans-serif; fill: #8A7A6C; }
      .box   { fill: #2A231D; stroke: #4A3F36; stroke-width: 1.5; }
      .pi    { fill: #2A231D; stroke: #F2EAE3; stroke-width: 1.5; }
      .panel { fill: #211C17; stroke: #3A312A; stroke-width: 1.5; }
      .v5   { stroke: #D0273F; stroke-width: 2.5; fill: none; }
      .gnd  { stroke: #8A7A6C; stroke-width: 2.5; fill: none; }
      .dat  { stroke: #F2AD9D; stroke-width: 2.5; fill: none; }
      .usb  { stroke: #F2EAE3; stroke-width: 3.5; fill: none; }
      .aud  { stroke: #B8A99C; stroke-width: 2.5; fill: none; stroke-dasharray: 7 4; }
      .air  { stroke: #F2EAE3; stroke-opacity: .6; stroke-width: 2; fill: none; stroke-dasharray: 2 6; stroke-linecap: round; }
      .dot  { stroke: none; }
    </style>
  </defs>

  <rect width="1500" height="1070" fill="#171310"/>

  <!-- Title -->
  <text x="40" y="58" class="t" font-size="32">Presentation setup · cabling</text>
  <text x="40" y="88" class="s" font-size="15">Simple by design: per unit one Pi, one power bank, one LED data wire. Everything else plugs in (USB, one AUX cable). Draft 04.10.2026.</text>

  <!-- ===================== WALL UNIT ===================== -->
  <rect x="30" y="120" width="710" height="760" rx="14" class="panel"/>
  <text x="55" y="158" class="t" font-size="24">Wall unit</text>
  <text x="170" y="158" class="s" font-size="13">Raspberry Pi 3B · mounted 1.5–2 m high, facing the table</text>

  <!-- Power bank A -->
  <rect x="55" y="245" width="170" height="110" rx="8" class="box"/>
  <text x="70" y="272" class="b" font-size="15">Power bank A</text>
  <text x="70" y="292" class="s" font-size="12">5 V · ≥ 3 A total</text>
  <text x="70" y="308" class="s" font-size="12">2 × USB-A</text>
  <text x="212" y="270" class="m" font-size="10" text-anchor="end">1</text>
  <text x="212" y="330" class="m" font-size="10" text-anchor="end">2</text>

  <!-- USB → wires adapter -->
  <rect x="265" y="250" width="120" height="50" rx="6" class="box"/>
  <text x="325" y="272" class="b" font-size="12" text-anchor="middle">USB → wires</text>
  <text x="325" y="288" class="m" font-size="10" text-anchor="middle">VCC · GND only</text>
  <path d="M225,275 H265" class="usb"/>

  <!-- Port 2 → Pi 3B power -->
  <path d="M225,325 H245 V470 H300" class="usb"/>
  <text x="252" y="400" class="m" font-size="10">USB-A →</text>
  <text x="252" y="413" class="m" font-size="10">micro-USB</text>

  <!-- LED ring (GROUND) -->
  <rect x="575" y="235" width="140" height="105" rx="8" class="box"/>
  <circle cx="645" cy="278" r="24" fill="none" stroke="#F2EAE3" stroke-width="5" stroke-dasharray="3 3"/>
  <text x="645" y="321" class="b" font-size="12" text-anchor="middle">LED ring</text>
  <rect x="612" y="327" width="66" height="16" rx="8" fill="#F2EAE3"/>
  <text x="645" y="339" font-family="'PP Neue Montreal', Arial, sans-serif" font-size="10" fill="#171310" text-anchor="middle">GROUND</text>
  <text x="582" y="262" class="m" font-size="9">5V</text>
  <text x="582" y="282" class="m" font-size="9">GND</text>
  <text x="582" y="312" class="m" font-size="9">DIN</text>

  <!-- Funnel strip (TOP) -->
  <rect x="575" y="400" width="140" height="115" rx="8" class="box"/>
  <path d="M610,425 H680 L665,460 H625 Z" fill="none" stroke="#E37156" stroke-width="2"/>
  <path d="M645,462 L630,488 M645,462 L645,490 M645,462 L660,488" stroke="#E37156" stroke-width="1.2" stroke-opacity=".7"/>
  <text x="645" y="505" class="b" font-size="12" text-anchor="middle">Funnel strip + foil</text>
  <rect x="612" y="519" width="66" height="16" rx="8" fill="#E37156"/>
  <text x="645" y="531" font-family="'PP Neue Montreal', Arial, sans-serif" font-size="10" fill="#171310" text-anchor="middle">TOP</text>
  <text x="582" y="437" class="m" font-size="9">GND</text>
  <text x="582" y="467" class="m" font-size="9">5V</text>
  <text x="694" y="413" class="m" font-size="9" text-anchor="end">DIN</text>
  <text x="720" y="470" class="m" font-size="10" text-anchor="end">→ table</text>

  <!-- Wall power rails -->
  <path d="M385,265 H575" class="v5"/>
  <path d="M540,265 V470 H575" class="v5"/>
  <circle cx="540" cy="265" r="4" fill="#D0273F" class="dot"/>
  <path d="M385,285 H575" class="gnd"/>
  <path d="M555,285 V440 H575" class="gnd"/>
  <circle cx="555" cy="285" r="4" fill="#8A7A6C" class="dot"/>
  <!-- 1000 µF -->
  <path d="M420,265 V272 M410,272 H430 M410,278 H430 M420,278 V285" stroke="#F2EAE3" stroke-width="2" fill="none"/>
  <text x="404" y="252" class="m" font-size="10">1000 µF</text>

  <!-- Pi 3B -->
  <rect x="300" y="430" width="230" height="170" rx="10" class="pi"/>
  <text x="315" y="498" class="t" font-size="19">Raspberry Pi 3B</text>
  <text x="315" y="518" class="s" font-size="11">led_node.py · radar reader · wall sound</text>
  <rect x="315" y="530" width="92" height="18" rx="9" fill="none" stroke="#F2EAE3" stroke-opacity=".6" stroke-dasharray="2 3"/>
  <text x="361" y="543" class="s" font-size="10" text-anchor="middle">Wi-Fi → router</text>
  <text x="308" y="466" class="m" font-size="9">PWR</text>
  <circle cx="440" cy="430" r="3.5" fill="#8A7A6C"/>
  <circle cx="490" cy="430" r="3.5" fill="#F2AD9D"/>
  <text x="440" y="446" class="m" font-size="9" text-anchor="middle">pin 20 GND</text>
  <text x="497" y="458" class="m" font-size="9" text-anchor="middle">pin 19 GPIO10</text>
  <text x="350" y="592" class="m" font-size="9" text-anchor="middle">USB</text>
  <text x="480" y="592" class="m" font-size="9" text-anchor="middle">3.5 mm</text>

  <!-- Pi 3B GND → common ground -->
  <path d="M440,430 V285" class="gnd"/>
  <circle cx="440" cy="285" r="4" fill="#8A7A6C" class="dot"/>
  <!-- Pi 3B data → 330 Ω → ring DIN (hops over the rails) -->
  <path d="M490,430 V315 H500" class="dat"/>
  <rect x="500" y="309" width="26" height="12" rx="2" fill="#171310" stroke="#F2AD9D" stroke-width="2"/>
  <text x="513" y="303" class="m" font-size="9" text-anchor="middle">330 Ω</text>
  <path d="M526,315 H534 a6,6 0 0 1 12,0 H549 a6,6 0 0 1 12,0 H575" class="dat"/>
  <!-- ring DOUT → funnel DIN -->
  <path d="M700,340 V400" class="dat"/>
  <text x="694" y="375" class="m" font-size="9" text-anchor="end">DOUT → DIN</text>

  <!-- Radar -->
  <rect x="55" y="640" width="170" height="80" rx="8" class="box"/>
  <text x="70" y="665" class="b" font-size="14">HLK-LD2450 radar</text>
  <text x="70" y="684" class="s" font-size="11">presence · up to 3 people</text>
  <text x="70" y="699" class="s" font-size="11">x / y in mm</text>
  <path d="M225,662 H265" class="v5"/>
  <path d="M225,674 H265" class="gnd"/>
  <path d="M225,686 H265" class="dat"/>
  <path d="M225,698 H265" class="dat"/>
  <rect x="265" y="650" width="120" height="58" rx="6" class="box"/>
  <text x="325" y="673" class="b" font-size="12" text-anchor="middle">USB-serial</text>
  <text x="325" y="689" class="m" font-size="10" text-anchor="middle">CP2102 / CH340</text>
  <path d="M350,650 V600" class="usb"/>
  <text x="70" y="742" class="s" font-size="11">5V · GND · TX→RX · RX←TX (crossed), ZH 1.5 plug</text>
  <text x="70" y="758" class="m" font-size="11">clear view of the table, never behind the foil</text>

  <!-- Wall sound: Marsboy speaker on AUX from the Pi 3B's own jack (own battery) -->
  <path d="M480,600 V650" class="aud"/>
  <rect x="430" y="650" width="170" height="85" rx="8" class="box"/>
  <circle cx="455" cy="678" r="12" fill="none" stroke="#F2EAE3" stroke-width="1.5"/>
  <circle cx="455" cy="678" r="4" fill="#F2EAE3"/>
  <text x="475" y="674" class="b" font-size="12">Marsboy speaker</text>
  <text x="475" y="688" class="m" font-size="10">AUX in · own battery</text>
  <text x="442" y="718" class="m" font-size="10">accents</text>
  <rect x="515" y="707" width="66" height="16" rx="8" fill="#76DBD8"/>
  <text x="548" y="719" font-family="'PP Neue Montreal', Arial, sans-serif" font-size="10" fill="#171310" text-anchor="middle">MIDDLE</text>
  <text x="488" y="630" class="m" font-size="10">3.5 mm cable</text>

  <text x="55" y="820" class="s" font-size="12">Accent sounds are stored on the Pi 3B; the host sends “play bird_cross” over MQTT,</text>
  <text x="55" y="837" class="s" font-size="12">so the sound really travels table → wall. LED frames arrive over Wi-Fi as DDP (like WLED).</text>

  <!-- ===================== TABLE UNIT ===================== -->
  <rect x="760" y="120" width="710" height="760" rx="14" class="panel"/>
  <text x="785" y="158" class="t" font-size="24">Table unit</text>
  <text x="903" y="158" class="s" font-size="13">Raspberry Pi 5 “dexy” under the folding table</text>

  <!-- Power bank B -->
  <rect x="785" y="245" width="190" height="130" rx="8" class="box"/>
  <text x="800" y="272" class="b" font-size="15">Power bank B</text>
  <text x="800" y="292" class="s" font-size="12">20,000 mAh · PD 45–65 W</text>
  <text x="800" y="308" class="s" font-size="12">USB-C PD + 2 × USB-A</text>
  <text x="962" y="266" class="m" font-size="10" text-anchor="end">A1</text>
  <text x="962" y="346" class="m" font-size="10" text-anchor="end">C</text>
  <text x="892" y="368" class="m" font-size="10">A2</text>

  <!-- adapter -->
  <rect x="1015" y="250" width="120" height="50" rx="6" class="box"/>
  <text x="1075" y="272" class="b" font-size="12" text-anchor="middle">USB → wires</text>
  <text x="1075" y="288" class="m" font-size="10" text-anchor="middle">VCC · GND only</text>
  <path d="M975,270 H1015" class="usb"/>

  <!-- C → Pi 5 -->
  <path d="M975,350 H1000 V470 H1050" class="usb"/>
  <text x="1008" y="405" class="m" font-size="10">USB-C PD · 5 V / 3 A</text>

  <!-- A2 → router -->
  <path d="M880,375 V400" class="usb"/>
  <rect x="790" y="400" width="195" height="62" rx="8" class="box"/>
  <text x="805" y="424" class="b" font-size="14">Travel router</text>
  <text x="805" y="441" class="s" font-size="11">USB-powered · 2.4 GHz Wi-Fi</text>
  <text x="805" y="455" class="m" font-size="10">Pi 3B · Pi 5 · laptop / phone</text>

  <!-- Table ring (MIDDLE) -->
  <rect x="1320" y="235" width="130" height="105" rx="8" class="box"/>
  <circle cx="1385" cy="278" r="24" fill="none" stroke="#76DBD8" stroke-width="5" stroke-dasharray="3 3"/>
  <text x="1385" y="321" class="b" font-size="11" text-anchor="middle">Table ring</text>
  <rect x="1352" y="327" width="66" height="16" rx="8" fill="#76DBD8"/>
  <text x="1385" y="339" font-family="'PP Neue Montreal', Arial, sans-serif" font-size="10" fill="#171310" text-anchor="middle">MIDDLE</text>
  <text x="1326" y="262" class="m" font-size="9">5V</text>
  <text x="1326" y="282" class="m" font-size="9">GND</text>
  <text x="1326" y="312" class="m" font-size="9">DIN</text>

  <!-- Table rails -->
  <path d="M1135,265 H1320" class="v5"/>
  <path d="M1135,285 H1320" class="gnd"/>
  <path d="M1160,265 V272 M1150,272 H1170 M1150,278 H1170 M1160,278 V285" stroke="#F2EAE3" stroke-width="2" fill="none"/>
  <text x="1144" y="252" class="m" font-size="10">1000 µF</text>

  <!-- Pi 5 -->
  <rect x="1050" y="430" width="230" height="180" rx="10" class="pi"/>
  <text x="1065" y="498" class="t" font-size="19">Raspberry Pi 5 · dexy</text>
  <text x="1065" y="518" class="s" font-size="11">host · web :8080 · led_node.py</text>
  <text x="1065" y="533" class="s" font-size="11">moment sound · Bluetooth to JBL</text>
  <rect x="1065" y="543" width="92" height="18" rx="9" fill="none" stroke="#F2EAE3" stroke-opacity=".6" stroke-dasharray="2 3"/>
  <text x="1111" y="556" class="s" font-size="10" text-anchor="middle">Wi-Fi → router</text>
  <text x="1058" y="466" class="m" font-size="9">PWR</text>
  <circle cx="1180" cy="430" r="3.5" fill="#8A7A6C"/>
  <circle cx="1230" cy="430" r="3.5" fill="#F2AD9D"/>
  <text x="1180" y="446" class="m" font-size="9" text-anchor="middle">pin 20 GND</text>
  <text x="1236" y="458" class="m" font-size="9" text-anchor="middle">pin 19 GPIO10</text>
  <text x="1090" y="602" class="m" font-size="9" text-anchor="middle">USB</text>
  <text x="1230" y="602" class="m" font-size="9" text-anchor="middle">USB</text>

  <path d="M1180,430 V285" class="gnd"/>
  <circle cx="1180" cy="285" r="4" fill="#8A7A6C" class="dot"/>
  <path d="M1230,430 V315 H1238" class="dat"/>
  <rect x="1238" y="309" width="26" height="12" rx="2" fill="#171310" stroke="#F2AD9D" stroke-width="2"/>
  <text x="1251" y="303" class="m" font-size="9" text-anchor="middle">330 Ω</text>
  <path d="M1264,315 H1320" class="dat"/>

  <!-- mic -->
  <path d="M1090,610 V680" class="usb"/>
  <rect x="1050" y="680" width="110" height="60" rx="8" class="box"/>
  <text x="1105" y="705" class="b" font-size="13" text-anchor="middle">USB mic</text>
  <text x="1105" y="722" class="m" font-size="10" text-anchor="middle">on the table</text>

  <!-- moment speaker = the existing USB speaker, straight into the Pi 5 -->
  <path d="M1230,610 V660" class="usb"/>
  <rect x="1180" y="660" width="160" height="85" rx="8" class="box"/>
  <circle cx="1205" cy="688" r="12" fill="none" stroke="#F2EAE3" stroke-width="1.5"/>
  <circle cx="1205" cy="688" r="4" fill="#F2EAE3"/>
  <text x="1225" y="684" class="b" font-size="12">USB speaker</text>
  <text x="1225" y="698" class="m" font-size="10">the one you have</text>
  <text x="1192" y="728" class="m" font-size="10">moment sound</text>
  <rect x="1267" y="717" width="50" height="16" rx="8" fill="#E37156"/>
  <text x="1292" y="729" font-family="'PP Neue Montreal', Arial, sans-serif" font-size="10" fill="#171310" text-anchor="middle">TOP</text>

  <!-- JBL over Bluetooth -->
  <path d="M1050,585 H1025 V805 H1060" class="air"/>
  <text x="1018" y="700" class="m" font-size="10" text-anchor="end">Bluetooth</text>
  <rect x="1060" y="770" width="180" height="75" rx="8" class="box"/>
  <text x="1075" y="795" class="b" font-size="14">JBL (Bluetooth)</text>
  <text x="1075" y="812" class="s" font-size="11">behind the commission</text>
  <rect x="1075" y="821" width="66" height="16" rx="8" fill="#F2EAE3"/>
  <text x="1108" y="833" font-family="'PP Neue Montreal', Arial, sans-serif" font-size="10" fill="#171310" text-anchor="middle">GROUND</text>

  <text x="785" y="520" class="s" font-size="12">Pi 5 USB total is 600 mA</text>
  <text x="785" y="536" class="s" font-size="12">on a 3 A supply: mic + USB</text>
  <text x="785" y="552" class="s" font-size="12">speaker fit (if sound drops: mains).</text>

  <!-- ===================== LEGEND + NOTES ===================== -->
  <text x="40" y="922" class="t" font-size="18">Wires</text>
  <path d="M40,945 H90" class="v5"/><text x="100" y="949" class="s" font-size="12">5 V</text>
  <path d="M40,967 H90" class="gnd"/><text x="100" y="971" class="s" font-size="12">GND (common)</text>
  <path d="M40,989 H90" class="dat"/><text x="100" y="993" class="s" font-size="12">LED data / UART</text>
  <path d="M200,945 H250" class="usb"/><text x="260" y="949" class="s" font-size="12">USB cable</text>
  <path d="M200,967 H250" class="aud"/><text x="260" y="971" class="s" font-size="12">audio (3.5 mm AUX)</text>
  <path d="M200,989 H250" class="air"/><text x="260" y="993" class="s" font-size="12">wireless</text>
  <text x="40" y="1020" class="m" font-size="11">Dot = joined. A hop = wires cross, not joined.</text>
  <text x="40" y="1036" class="m" font-size="11">Levels: GROUND white · MIDDLE blue · TOP sand.</text>

  <text x="430" y="922" class="t" font-size="18">Power budget (estimate)</text>
  <text x="430" y="947" class="b" font-size="12">Bank A: port 1 → wall LEDs, limit 1.5–2 A in led_node.py</text>
  <text x="430" y="965" class="b" font-size="12">port 2 → Pi 3B + radar ≈ 0.7–1 A (speaker on its own battery) → check the bank’s TOTAL</text>
  <text x="430" y="989" class="b" font-size="12">Bank B: C → Pi 5 + mic + USB speaker ≈ 1–2 A (less without Docker)</text>
  <text x="430" y="1007" class="b" font-size="12">A1 → table ring ≤ 1.5 A · A2 → router ≈ 0.5 A</text>

  <text x="1000" y="922" class="t" font-size="18">Rules</text>
  <text x="1000" y="947" class="b" font-size="12">LEDs never powered from a Pi’s 5 V pin, only from the bank.</text>
  <text x="1000" y="965" class="b" font-size="12">Pi GND joined to the LED supply GND (common ground).</text>
  <text x="1000" y="983" class="b" font-size="12">330 Ω at DIN, 1000 µF at the strip input, data wire &lt; 50 cm.</text>
  <text x="1000" y="1001" class="b" font-size="12">Flicker on 3.3 V data → add a 74AHCT125 level shifter.</text>
  <text x="1000" y="1019" class="b" font-size="12">GPIO10 = SPI: enable SPI on both Pis (sudo, Flo).</text>
  <text x="1000" y="1037" class="b" font-size="12">Shut the Pis down before pulling power (SD card).</text>
</svg>
