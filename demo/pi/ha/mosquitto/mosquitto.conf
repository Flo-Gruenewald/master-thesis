# Mosquitto for the room (replaces the host's embedded broker once [mqtt] mode = "external").
listener 1883
persistence true
persistence_location /mosquitto/data/
# Prototype on a private Wi-Fi: no login, like the embedded broker today.
# To require a login: set allow_anonymous false, uncomment password_file, then create a user with
#   docker exec -it mosquitto mosquitto_passwd -c /mosquitto/data/passwd easteregged
# and put the same user/password in the host's machine.toml [mqtt] and the ESPHome secrets.yaml.
allow_anonymous true
#password_file /mosquitto/data/passwd
