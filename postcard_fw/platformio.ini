; Tactile postcard (Scenario 3), ESP32-C3 SuperMini: one SF15-600 pressure strip on GPIO1 (10 kOhm divider, 3V3),
; one vibration motor via PN2222 (1 kOhm base resistor) on GPIO5. Pressure -> heartbeat (lub-dub), charge -> tempo.
; Build/flash from a short path (Windows path limits): copy this folder to C:pcpostcard (v4: Wi-Fi via WiFiManager, MQTT),
;   ..\venv\Scripts\pio.exe run -t upload      (C3 on USB)      monitor: ..\venv\Scripts\pio.exe device monitor
[env:c3]
platform = espressif32@6.3.2
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  tzapu/WiFiManager@^2.0.17
  knolleary/PubSubClient@^2.8

; 21.10.2026: the C3 breadboard broke → a classic ESP32 DevKit V1: pressure strip on D34 (ADC1), two coin motors in parallel
; on D5 (GPIO5) through the PN2222 (each motor with its own 1N4148/1N4007 across it). Upload: pio run -e esp32 -t upload
[env:esp32]
platform = espressif32@6.3.2
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DPIN_FSR_GPIO=34
lib_deps =
  tzapu/WiFiManager@^2.0.17
  knolleary/PubSubClient@^2.8
